<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dual Timer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #1f2328;
    --surface: #fff;
    --surface-alt: #eceff3;
    --border: #d5d9e0;
    --hover: #eef1f5;
    --muted: #6b7280;
    --active-border: #2e9e4f;
    --active-bg: #eaf7ee;
    --shimmer: rgba(46, 158, 79, .45);
  }
  [data-theme="dark"] {
    --bg: #241c3a;
    --fg: #ece8f7;
    --surface: #2f2550;
    --surface-alt: #3a2f61;
    --border: #4a3d78;
    --hover: #403471;
    --muted: #b3a8d4;
    --active-border: #a78bfa;
    --active-bg: #3d2f6b;
    --shimmer: rgba(167, 139, 250, .55);
  }
  body { font-family: system-ui, sans-serif; margin: 20px; background: var(--bg); color: var(--fg); }
  h1 { font-size: 20px; }
  .timers { display: flex; gap: 20px; }
  .timer { flex: 1; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 16px; text-align: center; }
  .timer.active { border-color: var(--active-border); background: var(--active-bg); }
  .clock { font-size: 42px; font-variant-numeric: tabular-nums; margin: 10px 0; }
  button { font-size: 15px; padding: 8px 16px; cursor: pointer; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 999px; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select { font-size: 15px; padding: 7px 10px; border-radius: 999px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .bar { margin: 16px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--surface); }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  th { background: var(--surface-alt); }
  tbody button { padding: 4px 12px; font-size: 13px; }
  tr.daygroup td { background: var(--surface-alt); font-weight: 600; }
  h2.collapser { font-size: 16px; cursor: pointer; user-select: none; }
  #caret { display: inline-block; width: 1em; font-size: 12px; }
  #caret.closed { transform: rotate(-90deg); }
  button.shimmer {
    background-image: linear-gradient(100deg, transparent 30%, var(--shimmer) 50%, transparent 70%);
    background-size: 300% 100%;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer {
    from { background-position: 150% 0; }
    to { background-position: -150% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    button.shimmer { animation: none; border-color: var(--active-border); }
  }
  .muted { color: var(--muted); font-size: 12px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<div class="head">
  <h1>Dual Timer</h1>
  <button id="themeBtn">Dark mode</button>
</div>

<div class="bar" style="display:none">
  <strong>User:</strong>
  <select id="userSel"></select>
  <button id="addUserBtn">Add User</button>
  <button id="renameUserBtn">Rename</button>
  <button id="delUserBtn">Delete User</button>
</div>

<div class="timers">
  <div class="timer" id="leftBox">
    <div>LEFT</div>
    <div class="clock" id="leftClock">00:00:00.0</div>
    <button id="leftBtn">Start</button>
  </div>
  <div class="timer" id="rightBox">
    <div>RIGHT</div>
    <div class="clock" id="rightClock">00:00:00.0</div>
    <button id="rightBtn">Start</button>
  </div>
</div>

<div class="bar">
  <strong>Session:</strong>
  <span id="sessionInfo" class="muted">not started</span>
  <button id="saveBtn">Save Session</button>
  <button id="resetBtn">Reset Current</button>
  <button id="exportBtn" style="display:none">Export JSON</button>
  <button id="exportCsvBtn">Export CSV</button>
</div>

<h2 id="sessionsToggle" class="collapser">
  <span id="caret">&#9660;</span>
  Saved Sessions <span id="userLabel" style="display:none"></span>(<span id="count">0</span>)
</h2>
<table id="tbl">
  <thead>
    <tr>
      <th>Started</th><th>Ended</th>
      <th>Started (UTC)</th><th>Ended (UTC)</th>
      <th>Left</th><th>Right</th><th>Combined</th><th>Gap since previous</th><th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
/* ============================================================
   DATA - the stored sessions live here, in the code.
   Use "Copy Data Snippet" in the app and paste the result
   over this block to bake new sessions into the file.
   ============================================================ */
var DATA = {
  activeUserId: 'u1',
  users: [
    { id: 'u1', name: 'User 1', sessions: [] },
    { id: 'u2', name: 'User 2', sessions: [] }
  ]
};

(function () {
  'use strict';

  var LS_KEY = 'dualTimer.store.v1';
  var store = { users: JSON.parse(JSON.stringify(DATA.users)) };
  var activeUserId = DATA.activeUserId;

  function user() {
    return store.users.find(function (u) { return u.id === activeUserId; });
  }

  function snapshot() {
    return { activeUserId: activeUserId, users: store.users };
  }

  function persist() {
    DATA = snapshot();
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(DATA));
    } catch (e) {
      console.warn('save failed', e);
    }
    fetch('/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DATA)
    }).catch(function () { /* no server: localStorage only */ });
  }

  // call copyDataSnippet() from the console to bake current data into the DATA block
  function dataSnippet() {
    return 'var DATA = ' + JSON.stringify(snapshot(), null, 2) + ';';
  }

  window.copyDataSnippet = function () {
    var text = dataSnippet();
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    return text;
  };

  function apply(data) {
    if (!data || !Array.isArray(data.users) || !data.users.length) return false;
    store.users = data.users;
    activeUserId = data.users.some(function (u) { return u.id === data.activeUserId; })
      ? data.activeUserId : data.users[0].id;
    return true;
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) apply(JSON.parse(raw));
    } catch (e) {
      console.warn('localStorage load failed', e);
    }
  }

  // data.json is the source of truth when the server is running
  function load() {
    loadLocal();
    render();
    renderTable();
    fetch('/data')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (apply(data)) { render(); renderTable(); }
      })
      .catch(function () { /* no server: localStorage only */ });
  }

  // exempts this origin from automatic storage eviction where supported
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(function (already) {
      if (!already) navigator.storage.persist();
    });
  }

  function commit() {
    persist();
    render();
    renderTable();
  }

  // ---- current session state ----
  var current = null;
  var active = null;      // 'left' | 'right' | null
  var activeStart = 0;    // ms epoch

  function newSession() {
    return {
      id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      utcDate: null,
      startedAt: null,
      endedAt: null,
      left: { totalMs: 0, runs: [] },
      right: { totalMs: 0, runs: [] }
    };
  }

  function fmt(ms) {
    if (ms < 0) ms = 0;
    var t = Math.floor(ms / 100);
    var tenths = t % 10;
    var s = Math.floor(t / 10);
    var hh = String(Math.floor(s / 3600)).padStart(2, '0');
    var mm = String(Math.floor(s / 60) % 60).padStart(2, '0');
    var ss = String(s % 60).padStart(2, '0');
    return hh + ':' + mm + ':' + ss + '.' + tenths;
  }

  function elapsed(side) {
    var base = current ? current[side].totalMs : 0;
    if (active === side) base += Date.now() - activeStart;
    return base;
  }

  function stopActive() {
    if (!active) return;
    var now = Date.now();
    var dur = now - activeStart;
    current[active].totalMs += dur;
    current[active].runs.push({
      startedAt: new Date(activeStart).toISOString(),
      endedAt: new Date(now).toISOString(),
      durationMs: dur
    });
    current.endedAt = new Date(now).toISOString();
    active = null;
  }

  function start(side) {
    if (!current) {
      current = newSession();
      current.startedAt = new Date().toISOString();
      current.utcDate = current.startedAt.slice(0, 10);
    }
    stopActive();             // mutual exclusion: stop the other one
    active = side;
    activeStart = Date.now();
  }

  function toggle(side) {
    if (active === side) stopActive(); else start(side);
    render();
  }

  // ---- rendering ----
  var $ = function (id) { return document.getElementById(id); };

  function render() {
    $('leftClock').textContent = fmt(elapsed('left'));
    $('rightClock').textContent = fmt(elapsed('right'));
    $('leftBtn').textContent = active === 'left' ? 'Stop' : 'Start';
    $('rightBtn').textContent = active === 'right' ? 'Stop' : 'Start';
    $('leftBox').className = 'timer' + (active === 'left' ? ' active' : '');
    $('rightBox').className = 'timer' + (active === 'right' ? ' active' : '');

    if (!current) {
      $('sessionInfo').textContent = 'not started';
    } else {
      $('sessionInfo').textContent =
        'started ' + localTime(current.startedAt) +
        ' | combined ' + fmt(elapsed('left') + elapsed('right'));
    }
    $('saveBtn').disabled = !current;
    $('resetBtn').disabled = !current;
    $('exportBtn').disabled = user().sessions.length === 0;
    $('exportCsvBtn').disabled = user().sessions.length === 0;
    $('exportCsvBtn').className = exportOverdue() ? 'shimmer' : '';
    $('exportCsvBtn').title = exportOverdue() ? 'No export yet today - time to back up' : '';
    $('delUserBtn').disabled = store.users.length <= 1;
    $('userLabel').textContent = user().name;
  }

  function renderUsers() {
    var sel = $('userSel');
    sel.textContent = '';
    store.users.forEach(function (u) {
      var o = document.createElement('option');
      o.value = u.id;
      o.textContent = u.name + ' (' + u.sessions.length + ')';
      sel.appendChild(o);
    });
    sel.value = activeUserId;
  }

  function fmtGap(ms) {
    if (ms == null) return '-';
    if (ms < 0) ms = 0;
    var s = Math.round(ms / 1000);
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + (s % 60) + 's';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }

  function timeOfDay(iso) {
    return iso ? iso.slice(11, 19) : '';
  }

  function localTime(iso) {
    return iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  }

  var EXPORT_KEY = 'dualTimer.lastExportDay';
  var REMIND_HOUR = 20;

  function localDay(d) {
    d = d || new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function lastExportDay() {
    try { return localStorage.getItem(EXPORT_KEY); } catch (e) { return null; }
  }

  function markExported() {
    try { localStorage.setItem(EXPORT_KEY, localDay()); } catch (e) { /* ignore */ }
  }

  // set window.forceShimmer = true in the console to preview the reminder
  function exportOverdue() {
    if (window.forceShimmer) return true;
    return new Date().getHours() >= REMIND_HOUR &&
      user().sessions.length > 0 &&
      lastExportDay() !== localDay();
  }

  function renderTable() {
    var tb = $('tbl').querySelector('tbody');
    tb.textContent = '';

    var sorted = user().sessions.slice().sort(function (a, b) {
      return new Date(a.startedAt) - new Date(b.startedAt);
    });
    var gaps = sorted.map(function (s, i) {
      return i === 0 ? null : new Date(s.startedAt) - new Date(sorted[i - 1].endedAt);
    });

    var days = [];
    sorted.forEach(function (s, i) {
      var day = days[days.length - 1];
      if (!day || day.date !== s.utcDate) {
        day = { date: s.utcDate, rows: [] };
        days.push(day);
      }
      day.rows.push({ s: s, gap: gaps[i] });
    });
    days.reverse();

    days.forEach(function (day) {
      var total = day.rows.reduce(function (n, r) { return n + r.s.combinedMs; }, 0);
      var head = document.createElement('tr');
      head.className = 'daygroup';
      var hc = document.createElement('td');
      hc.colSpan = 9;
      hc.textContent = day.date + ' - ' + day.rows.length + ' session(s), ' +
        fmt(total) + ' combined';
      head.appendChild(hc);
      tb.appendChild(head);

      day.rows.slice().reverse().forEach(function (r) {
        var s = r.s;
        var tr = document.createElement('tr');
        [localTime(s.startedAt), localTime(s.endedAt),
          timeOfDay(s.startedAt), timeOfDay(s.endedAt), fmt(s.left.totalMs),
          fmt(s.right.totalMs), fmt(s.combinedMs), fmtGap(r.gap)
        ].forEach(function (v) {
          var td = document.createElement('td');
          td.textContent = v == null ? '' : String(v);
          tr.appendChild(td);
        });
        var td = document.createElement('td');
        var b = document.createElement('button');
        b.textContent = 'Delete';
        b.addEventListener('click', function () { deleteSession(s.id); });
        td.appendChild(b);
        tr.appendChild(td);
        tb.appendChild(tr);
      });
    });

    $('count').textContent = user().sessions.length;
    renderUsers();
  }

  // ---- actions ----
  function saveSession() {
    if (!current) return;
    stopActive();
    var rec = JSON.parse(JSON.stringify(current));
    rec.combinedMs = rec.left.totalMs + rec.right.totalMs;
    rec.wallClockMs = rec.endedAt
      ? new Date(rec.endedAt) - new Date(rec.startedAt)
      : 0;
    rec.savedAt = new Date().toISOString();
    rec.userId = activeUserId;
    rec.userName = user().name;
    user().sessions.push(rec);
    current = null;
    commit();
  }

  function deleteSession(id) {
    var list = user().sessions;
    var s = list.find(function (x) { return x.id === id; });
    if (!s) return;
    if (!window.confirm('Delete session from ' + s.startedAt + ' for ' + user().name + '?\nThis cannot be undone.')) return;
    user().sessions = list.filter(function (x) { return x.id !== id; });
    commit();
  }

  // ---- user actions ----
  function unsavedBlocks() {
    return !!current &&
      !window.confirm('The current session is unsaved and will be discarded. Continue?');
  }

  function switchUser(id) {
    if (id === activeUserId) return;
    if (unsavedBlocks()) { $('userSel').value = activeUserId; return; }
    active = null;
    current = null;
    activeUserId = id;
    commit();
  }

  function addUser() {
    var name = window.prompt('New user name:', 'User ' + (store.users.length + 1));
    if (!name) return;
    name = name.trim();
    if (!name) return;
    if (unsavedBlocks()) return;
    var u = { id: 'u_' + Date.now().toString(36), name: name, sessions: [] };
    store.users.push(u);
    active = null;
    current = null;
    activeUserId = u.id;
    commit();
  }

  function renameUser() {
    var name = window.prompt('Rename user:', user().name);
    if (!name || !name.trim()) return;
    user().name = name.trim();
    commit();
  }

  function deleteUser() {
    if (store.users.length <= 1) return;
    var u = user();
    if (!window.confirm('Delete user "' + u.name + '" and all ' + u.sessions.length +
      ' saved session(s)?\nThis cannot be undone.')) return;
    store.users = store.users.filter(function (x) { return x.id !== u.id; });
    activeUserId = store.users[0].id;
    active = null;
    current = null;
    commit();
  }

  function resetCurrent() {
    if (!current) return;
    if (!window.confirm('Discard the current unsaved session?')) return;
    active = null;
    current = null;
    render();
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    URL.revokeObjectURL(url);
  }

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'user';
  }

  function fileName(ext) {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var date = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    var time = p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
    return 'timer_' + date + '-' + time + '.' + ext;
  }

  function exportJson() {
    var u = user();
    download(fileName('json'), JSON.stringify({
      userId: u.id, userName: u.name, exportedAt: new Date().toISOString(), sessions: u.sessions
    }, null, 2), 'application/json');
  }

  function csvCell(v) {
    return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  }

  var CSV_HEAD = ['userId', 'userName', 'sessionId', 'utcDate', 'startedAt', 'endedAt',
    'leftMs', 'rightMs', 'combinedMs', 'wallClockMs', 'savedAt'];

  function csvRows(users) {
    var rows = [];
    users.forEach(function (u) {
      u.sessions.forEach(function (s) {
        rows.push([u.id, u.name, s.id, s.utcDate, s.startedAt, s.endedAt, s.left.totalMs,
          s.right.totalMs, s.combinedMs, s.wallClockMs, s.savedAt].map(csvCell).join(','));
      });
    });
    return rows;
  }

  function csvText(users) {
    return [CSV_HEAD.join(',')].concat(csvRows(users)).join('\n') + '\n';
  }

  function exportCsv() {
    download(fileName('csv'), csvText([user()]), 'text/csv');
    markExported();
    render();
  }

  $('leftBtn').addEventListener('click', function () { toggle('left'); });
  $('rightBtn').addEventListener('click', function () { toggle('right'); });
  $('saveBtn').addEventListener('click', saveSession);
  $('resetBtn').addEventListener('click', resetCurrent);
  $('exportBtn').addEventListener('click', exportJson);
  $('exportCsvBtn').addEventListener('click', exportCsv);
  $('userSel').addEventListener('change', function (e) { switchUser(e.target.value); });
  $('addUserBtn').addEventListener('click', addUser);
  $('renameUserBtn').addEventListener('click', renameUser);
  $('delUserBtn').addEventListener('click', deleteUser);
  $('sessionsToggle').addEventListener('click', function () {
    var open = $('tbl').style.display !== 'none';
    $('tbl').style.display = open ? 'none' : '';
    $('caret').className = open ? 'closed' : '';
  });

  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    $('themeBtn').textContent = mode === 'dark' ? 'Light mode' : 'Dark mode';
  }
  $('themeBtn').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  load();
  setInterval(render, 100);
  render();
  renderTable();
})();
</script>
</body>
</html>
